<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Too Many Requests</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        body{

            margin:0;

            height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background:#0f172a;

            font-family:Arial, Helvetica, sans-serif;

        }

        .error-card{

            width:420px;

            padding:40px;

            background:#1e293b;

            border-radius:18px;

            text-align:center;

            color:white;

            box-shadow:0 15px 35px rgba(0,0,0,.35);

        }

        h1{

            color:#ef4444;

            margin-bottom:20px;

            font-size:32px;

        }

        p{

            color:#cbd5e1;

            line-height:1.6;

            margin-bottom:25px;

        }

        a{

            display:inline-block;

            padding:12px 24px;

            background:#2563eb;

            color:white;

            text-decoration:none;

            border-radius:10px;

            transition:.3s;

        }

        a:hover{

            background:#1d4ed8;

        }

    </style>

</head>

<body>

<div class="error-card">

    <h1>🚫 Too Many Requests</h1>

    <p>

        You've exceeded the maximum number of requests.

        Please wait one minute before trying again.

    </p>

    <a href="{{ url_for('auth.login') }}">

        Back to Login

    </a>

</div>

</body>

</html>
