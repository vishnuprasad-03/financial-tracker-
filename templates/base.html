<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finance Tracker</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family: Arial, Helvetica, sans-serif;
            background:#f4f6f8;
            padding:40px;
        }

        h1{

            text-align:center;
            margin-bottom:30px;
            color:#2c3e50;
        }

        table{

            width:100%;
            border-collapse:collapse;
            background:white;

            box-shadow:0px 3px 10px rgba(0,0,0,0.1);
        }

        th{

            background:#2c3e50;
            color:white;
            padding:15px;
        }

        td{

            padding:14px;
            border:1px solid #ddd;
        }

        tr:nth-child(even){

            background:#f8f8f8;
        }

        tr:hover{

            background:#eef6ff;
        }

        .income{

            color:green;
            font-weight:bold;
        }

        .expense{

            color:red;
            font-weight:bold;
        }

    </style>

</head>

<body>

{% block content %}

{% endblock %}

</body>

</html>
