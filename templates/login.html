<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finance Tracker | Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background:linear-gradient(135deg,#4facfe,#00f2fe,#43e97b);

        }

        .login-container{

            width:380px;

            background:white;

            padding:40px;

            border-radius:18px;

            box-shadow:0 15px 35px rgba(0,0,0,0.25);

            text-align:center;

        }

        h1{

            color:#0d6efd;

            margin-bottom:10px;

        }

        p{

            color:#666;

            margin-bottom:30px;

        }

        input{

            width:100%;

            padding:14px;

            margin:10px 0;

            border:1px solid #ddd;

            border-radius:10px;

            outline:none;

            font-size:16px;

        }

        input:focus{

            border-color:#0d6efd;

            box-shadow:0 0 8px rgba(13,110,253,.4);

        }

        button{

            width:100%;

            padding:14px;

            margin-top:20px;

            border:none;

            border-radius:10px;

            background:#0d6efd;

            color:white;

            font-size:17px;

            cursor:pointer;

            transition:.3s;

        }

        button:hover{

            background:#084fc7;

            transform:scale(1.03);

        }

        .footer{

            margin-top:25px;

            color:#777;

            font-size:14px;

        }

        .footer a{

            color:#0d6efd;

            text-decoration:none;

            font-weight:bold;

        }

        .icon{

            font-size:55px;

            margin-bottom:15px;

        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="icon">
        💰
    </div>

    <h1>Finance Tracker</h1>

    <p>Login to continue</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}

        {% for category, message in messages %}

            <div class="flash {{ category }}">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}
{% endwith %}

    <form method="POST">

        <input
    type="text"
    name="username"
    placeholder="👤 Username"
    value="{{ username if username else '' }}"
    required
>

        <input
            type="password"
            name="password"
            placeholder="🔒 Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <div class="footer">

        New User?
        <a href="/register">Register</a>

    </div>

</div>

<script>
setTimeout(function () {

    const flashes = document.querySelectorAll(".flash");

    flashes.forEach(function (flash) {

        flash.style.transition = "opacity 0.5s";

        flash.style.opacity = "0";

        setTimeout(function () {

            flash.remove();

        }, 500);

    });

}, 3000);
</script>

</body>

</html>
